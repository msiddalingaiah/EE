<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Osprey</title>
    <meta name="theme-color" content="#15181d" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <span class="brand">Osprey</span>
      <nav id="menubar" class="menubar" aria-label="Menu"></nav>
      <span class="toolbar-sep"></span>
      <button id="save-btn" class="icon-btn" type="button" disabled title="Save (Ctrl+S)" aria-label="Save"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h9l2 2v9h-11z M5 2.5v3.5h5v-3.5 M4.5 13.5v-4.5h7v4.5" /></svg></button>
      <button id="undo-btn" class="icon-btn" type="button" disabled title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3 2.5 6l3 3 M2.5 6h7a4 4 0 0 1 0 8h-3" /></svg></button>
      <button id="redo-btn" class="icon-btn" type="button" disabled title="Redo (Ctrl+Y)" aria-label="Redo"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 3l3 3-3 3 M13.5 6h-7a4 4 0 0 0 0 8h3" /></svg></button>
      <span class="toolbar-sep"></span>
      <input id="file-input" type="file" accept=".osprey,.ospreylib,.sch,.brd,.lbr" multiple hidden />
      <div id="view-toggle" class="view-toggle" role="group" aria-label="View" hidden>
        <button type="button" data-view="schematic" title="Schematic (Tab switches)">Schematic</button>
        <button type="button" data-view="board" title="Board (Tab switches)">Board</button>
      </div>
      <label class="field" id="sheet-field" hidden>
        <span>Sheet</span>
        <select id="sheet-select"></select>
      </label>
      <button id="wire-btn" type="button" hidden title="Draw wires (W): click to start, click to add corners; a wire ends on a pin or wire, or with a double click or Esc">Wire</button>
      <button id="pour-btn" type="button" hidden title="Draw a copper pour: click the corners; click the first corner, double-click or press Enter to close. The first click on copper picks the net; L changes layer, / free angles.">Pour</button>
      <button id="via-btn" type="button" hidden title="Place vias: click to add one; it takes the net of the copper under it (pad, trace, via or pour), else the last via's net. Shift+click places one that breaks clearance. Esc or right-click stops.">Via</button>
      <button id="text-btn" type="button" hidden title="Add text (T): click where it goes, then type it. On the bottom layer it goes on the bottom silkscreen, mirrored.">Text</button>
      <span id="draw-tools" class="draw-tools" role="group" aria-label="Draw" hidden>
        <button type="button" data-tool="pin" title="Add pins: click to place each (Esc stops)">Pin</button>
        <button type="button" data-tool="pad" title="Add through-hole pads: click to place each (Esc stops)">Pad</button>
        <button type="button" data-tool="smd" title="Add SMD pads: click to place each (Esc stops)">SMD</button>
        <button type="button" data-tool="line" title="Draw lines: click corners; double-click, Enter or Esc ends">Line</button>
        <button type="button" data-tool="rect" title="Draw rectangles: click two corners">Rect</button>
        <button type="button" data-tool="circle" title="Draw circles: click the centre, then a point on the circle">Circle</button>
        <button type="button" data-tool="text" title="Add text: click to place (edit it in the inspector; >NAME and >VALUE show the part's)">Text</button>
      </span>
      <label id="layer-field" class="layer-field" hidden title="The copper layer Route and Pour work on (L switches)">Layer <select id="layer-select" aria-label="Copper layer"></select></label>
      <label id="width-field" class="layer-field" hidden title="The width of the traces this route draws: the net's default, a standard size, or Other… to type one (mm or mil)">Width <span id="width-slot"></span></label>
      <button id="fit-btn" type="button" title="Zoom to fit (Home)">Fit</button>
      <input id="cam-input" type="file" accept=".cam" hidden />
      <span id="doc-title" class="doc-title"></span>
    </header>

    <main class="workspace">
      <aside class="panel left">
        <section id="project-panel" hidden></section>
        <section id="parts-panel" hidden>
          <h2>Add part <span class="panel-actions"><button id="parts-update" type="button" disabled>Update</button><kbd>A</kbd></span></h2>
          <select id="parts-source" aria-label="Library"></select>
          <input id="parts-filter" type="search" placeholder="Find a component…" />
          <div id="parts-list" class="library-list parts-list"></div>
          <div id="parts-choice" class="parts-choice" hidden></div>
        </section>
        <input id="lbr-input" type="file" accept=".ospreylib,.lbr" multiple hidden />
        <section id="drc-panel" hidden>
          <h2>Design rules <span class="panel-actions"><button id="drc-run" type="button" title="Check the board against its design rules">Check</button></span></h2>
          <div class="drc-rules">Rules: <span id="drc-name"></span></div>
          <select id="drc-load" aria-label="Load design rules"></select>
          <div id="drc-summary" class="drc-summary"></div>
          <div id="drc-list" class="library-list drc-list"></div>
        </section>
        <input id="dru-input" type="file" accept=".dru" hidden />
        <section id="erc-panel" hidden>
          <h2>Electrical rules <span class="panel-actions"><button id="erc-run" type="button" title="Check the schematic: unconnected pins, single-pin nets, outputs driving each other, supplies joined, parts missing from the board">Check</button></span></h2>
          <div id="erc-summary" class="drc-summary"></div>
          <div id="erc-list" class="library-list drc-list"></div>
        </section>
        <section id="blocks-panel" data-collapsible hidden>
          <h2>Blocks <span class="panel-actions"><button id="blocks-suggest" type="button" title="Suggest blocks for the parts that have none, from how they are wired: ICs and transistors anchor blocks, other parts join the one they connect to most closely. One undo step; adjust with B.">Suggest</button><button id="blocks-place" type="button" title="Place the board's unlocked parts block by block: each block around its main part, the blocks beside each other, the outline and corner holes fitted around them. One undo step.">Place</button></span></h2>
          <div id="blocks-list" class="library-list blocks-list"></div>
        </section>
        <section id="lcsc-panel" data-collapsible hidden>
          <h2>JLCPCB parts <span class="panel-actions"><button id="lcsc-assign" type="button" title="Give each chip resistor and capacitor (0603, 0805) without an LCSC part number the JLCPCB Basic part for its value and package (else a preferred Extended one; capacitors: C0G/X7R first, then the lowest voltage from 25 V). One undo step.">Assign</button></span></h2>
          <label class="check-row" title="Through-hole parts (headers, connectors, TO-92…) are usually soldered by hand, so they're left out here as in the assembly files"><input id="lcsc-tht" type="checkbox" /> Include through-hole parts</label>
          <div id="lcsc-summary" class="drc-summary"></div>
          <div id="lcsc-list" class="library-list drc-list"></div>
        </section>
        <section id="library-panel" hidden>
          <h2>Library</h2>
          <div class="lib-actions">
            <button id="new-symbol-btn" type="button" title="Add a new, empty symbol">+ Symbol</button>
            <button id="new-footprint-btn" type="button" title="Add a new, empty footprint">+ Footprint</button>
            <button id="new-component-btn" type="button" title="Add a new component: gates (symbols), variants (footprints) and how pins connect to pads">+ Component</button>
          </div>
          <select id="copy-from" aria-label="Copy items from another library or a project" title="Copy symbols, footprints and components from another library, or from a project's library"></select>
          <input id="copy-input" type="file" accept=".ospreylib,.lbr,.osprey" hidden />
          <div id="copy-banner" class="copy-banner" hidden></div>
          <div id="library-tabs" class="lib-tabs" role="tablist" aria-label="Library items">
            <button type="button" role="tab" data-kind="component">Components</button>
            <button type="button" role="tab" data-kind="symbol">Symbols</button>
            <button type="button" role="tab" data-kind="footprint">Footprints</button>
          </div>
          <input id="library-filter" type="search" placeholder="Filter by name or description…" />
          <div id="library-list" class="library-list"></div>
        </section>
        <section id="layers-panel">
          <h2>
            Layers
            <span class="panel-actions">
              <button id="layers-all" type="button">All</button>
              <button id="layers-none" type="button">None</button>
            </span>
          </h2>
          <ul id="layer-list" class="layer-list"></ul>
        </section>
      </aside>

      <div id="stage" class="stage">
        <canvas id="canvas" tabindex="0" aria-label="Design canvas"></canvas>
        <div id="error" class="error" role="alert" hidden><span id="error-text"></span><button id="error-close" type="button" class="error-close" title="Close" aria-label="Close">×</button></div>
        <div id="drop-overlay" class="drop-overlay" hidden>Drop an Eagle file to open it</div>
      </div>

      <aside class="panel right">
        <h2>Selection</h2>
        <div id="inspector"></div>
      </aside>
    </main>

    <footer class="status">
      <span id="status-pos"></span>
      <span id="status-zoom"></span>
      <span id="status-sel"></span>
      <span id="status-msg" class="status-msg"></span>
      <span id="status-hint" class="status-hint"></span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
