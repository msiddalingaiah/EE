<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Osprey</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <span class="brand">Osprey</span>
      <button id="open-btn" type="button" title="Open a schematic and its board together (select both), or a library. Files can also be dropped on the canvas.">Open…</button>
      <input id="file-input" type="file" accept=".sch,.brd,.lbr" multiple hidden />
      <label class="field">
        <span>Sample</span>
        <select id="sample-select"></select>
      </label>
      <label class="field" id="sheet-field" hidden>
        <span>Sheet</span>
        <select id="sheet-select"></select>
      </label>
      <div id="view-toggle" class="view-toggle" role="group" aria-label="View" hidden>
        <button type="button" data-view="schematic" title="Schematic (Tab switches)">Schematic</button>
        <button type="button" data-view="board" title="Board (Tab switches)">Board</button>
      </div>
      <button id="fit-btn" type="button" title="Zoom to fit (Home)">Fit</button>
      <label id="layer-field" class="layer-field" hidden title="The copper layer Route and Pour work on (L switches)">Layer <select id="layer-select" aria-label="Copper layer"></select></label>
      <button id="pour-btn" type="button" hidden title="Draw a copper pour: click the corners; click the first corner, double-click or press Enter to close. The first click on copper picks the net; L changes layer, / free angles.">Pour</button>
      <button id="wire-btn" type="button" hidden title="Draw wires (W): click to start, click to add corners; a wire ends on a pin or wire, or with a double click or Esc">Wire</button>
      <span class="toolbar-sep"></span>
      <button id="undo-btn" type="button" disabled>Undo</button>
      <button id="redo-btn" type="button" disabled>Redo</button>
      <button id="save-btn" type="button" disabled title="Save (Ctrl+S)">Save</button>
      <button id="export-btn" type="button" disabled title="Export the project as an Eagle schematic and board (.sch + .brd)">Export Eagle…</button>
      <span id="doc-title" class="doc-title"></span>
    </header>

    <main class="workspace">
      <aside class="panel left">
        <section id="project-panel" hidden></section>
        <section id="parts-panel" hidden>
          <h2>Add part <span class="panel-actions"><kbd>A</kbd></span></h2>
          <select id="parts-source" aria-label="Library"></select>
          <input id="parts-filter" type="search" placeholder="Find a component…" />
          <div id="parts-list" class="library-list parts-list"></div>
          <div id="parts-choice" class="parts-choice" hidden></div>
        </section>
        <input id="lbr-input" type="file" accept=".lbr" multiple hidden />
        <section id="drc-panel" hidden>
          <h2>Design rules <span class="panel-actions"><button id="drc-run" type="button" title="Check the board against its design rules">Check</button></span></h2>
          <div class="drc-rules">Rules: <span id="drc-name"></span></div>
          <select id="drc-load" aria-label="Load design rules"></select>
          <div id="drc-summary" class="drc-summary"></div>
          <div id="drc-list" class="library-list drc-list"></div>
        </section>
        <input id="dru-input" type="file" accept=".dru" hidden />
        <section id="library-panel" hidden>
          <h2>Library</h2>
          <input id="library-filter" type="search" placeholder="Filter…" />
          <div id="library-list" class="library-list"></div>
        </section>
        <section id="layers-panel">
          <h2>
            Layers
            <span class="panel-actions">
              <button id="layers-all" type="button">All</button>
              <button id="layers-none" type="button">None</button>
            </span>
          </h2>
          <ul id="layer-list" class="layer-list"></ul>
        </section>
      </aside>

      <div id="stage" class="stage">
        <canvas id="canvas" tabindex="0" aria-label="Design canvas"></canvas>
        <div id="error" class="error" hidden></div>
        <div id="drop-overlay" class="drop-overlay" hidden>Drop an Eagle file to open it</div>
      </div>

      <aside class="panel right">
        <h2>Selection</h2>
        <div id="inspector"></div>
      </aside>
    </main>

    <footer class="status">
      <span id="status-pos"></span>
      <span id="status-zoom"></span>
      <span id="status-sel"></span>
      <span id="status-msg" class="status-msg"></span>
      <span id="status-hint" class="status-hint"></span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
